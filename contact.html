<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Melina Suriani</title>
<meta name="description" content="Get in touch with Melina Suriani about styling, creative direction, design or photography.">
<link rel="canonical" href="https://melinasuriani.com/contact">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact — Melina Suriani">
<meta property="og:description" content="Get in touch with Melina Suriani about styling, creative direction, design or photography.">
<meta property="og:url" content="https://melinasuriani.com/contact">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="home.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/#hub" class="wordmark">melina</a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav">menu</button>
    <nav class="main-nav" id="mainNav">
      <a href="/about">about</a>
      <a href="/contact" aria-current="page">contact</a>
    </nav>
  </div>
</header>

<main>

  <section class="contact wrap" id="get-in-touch">
    <h1 class="contact-heading">Get in touch</h1>

    <form class="contact-form" id="contactForm" name="contact" method="POST" action="/thanks" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p class="contact-hp" aria-hidden="true"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

      <div class="contact-row">
        <label class="contact-field">
          <span>Name</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label class="contact-field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
      </div>


      <label class="contact-field">
        <span>Message</span>
        <textarea name="message" rows="6" required></textarea>
      </label>

      <button class="contact-send" type="submit">Send message</button>
      <p class="contact-status" id="contactStatus" role="status" aria-live="polite"></p>
    </form>

    <p class="contact-alt">Or email me directly at <a href="mailto:melinasuriani@gmail.com">melinasuriani@gmail.com</a></p>
  </section>

</main>

<footer class="site-footer" id="contact">
  <div class="wrap">
    <p class="footer-headline">Have a project in mind? <a href="/contact">Get in touch</a> — <em>let's make something.</em></p>
  </div>
  <div class="wrap footer-meta">
    <span>© <span id="year"></span> Melina Suriani</span>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
